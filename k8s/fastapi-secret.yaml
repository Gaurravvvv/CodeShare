apiVersion: v1
kind: Secret
metadata:
  name: fastapi-secrets
  labels:
    app: codeshare-fastapi
type: Opaque
stringData:
  # Replace these with your actual base64 encoded secrets or use SOPS/ExternalSecrets
  GROQ_API_KEY: "your_groq_api_key_here"
  CRON_SECRET: "your_cron_secret_here"
  FILEBASE_KEY: "your_filebase_key_here"
  FILEBASE_SECRET: "your_filebase_secret_here"
  FILEBASE_BUCKET: "your_filebase_bucket_here"
