apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeshare-fastapi
  labels:
    app: codeshare-fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codeshare-fastapi
  template:
    metadata:
      labels:
        app: codeshare-fastapi
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: fastapi
          image: ghcr.io/gaurravvvv/codeshare-fastapi-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: REDIS_URL
              value: "redis://:password@redis-service:6379"
          envFrom:
            - secretRef:
                name: fastapi-secrets
