apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeshare-client
  labels:
    app: codeshare-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codeshare-client
  template:
    metadata:
      labels:
        app: codeshare-client
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: client
          image: ghcr.io/gaurravvvv/codeshare-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
